<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="PocketAI — Local AI, no cloud required." />
  <title>PocketAI</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">

    <!-- Sidebar -->
    <aside id="sidebar">
      <div class="sidebar-top">
        <div class="brand">
          <span class="brand-icon">◈</span>
          <span class="brand-name">PocketAI</span>
        </div>
        <div class="server-status" id="serverStatus">
          <span class="status-dot" id="statusDot"></span>
          <span class="status-label" id="statusLabel">connecting</span>
        </div>
      </div>

      <div class="sidebar-meta">
        <div class="meta-row">
          <span class="meta-key">endpoint</span>
          <span class="meta-val">127.0.0.1:8080</span>
        </div>
        <div class="meta-row">
          <span class="meta-key">mode</span>
          <span class="meta-val">offline</span>
        </div>
        <div class="meta-row">
          <span class="meta-key">backend</span>
          <span class="meta-val">llama.cpp</span>
        </div>
        <div class="meta-row" id="tokenRow">
          <span class="meta-key">tokens</span>
          <span class="meta-val" id="tokenCount">0</span>
        </div>
      </div>

      <div class="sidebar-actions">
        <button id="clearBtn" class="action-btn" title="Clear conversation">
          <span class="btn-icon">⌫</span>
          <span>clear session</span>
        </button>
        <button id="exportBtn" class="action-btn" title="Export conversation as JSON">
          <span class="btn-icon">↓</span>
          <span>export log</span>
        </button>
      </div>

      <div class="sidebar-params">
        <div class="param-heading">parameters</div>
        <div class="param-row">
          <label for="tempSlider" class="param-key">temperature</label>
          <span class="param-val" id="tempVal">0.70</span>
        </div>
        <input type="range" id="tempSlider" class="param-slider" min="0" max="2" step="0.01" value="0.7" />
        <div class="param-row">
          <label for="tokensSlider" class="param-key">max tokens</label>
          <span class="param-val" id="tokensVal">512</span>
        </div>
        <input type="range" id="tokensSlider" class="param-slider" min="64" max="4096" step="64" value="512" />
        <div class="param-row">
          <label for="systemPrompt" class="param-key">system prompt</label>
        </div>
        <textarea
          id="systemPrompt"
          class="system-textarea"
          placeholder="You are a helpful assistant."
          rows="3"
          spellcheck="false"
        ></textarea>
      </div>

      <div class="sidebar-footer">
        <span>v0.1.0 · local-first</span>
      </div>
    </aside>

    <!-- Main -->
    <main id="main">

      <!-- Top bar (mobile + desktop) -->
      <header id="topbar">
        <button id="sidebarToggle" class="icon-btn" aria-label="Toggle sidebar">☰</button>
        <span class="topbar-title">PocketAI</span>
        <div class="topbar-status">
          <span class="status-dot-sm" id="topStatusDot"></span>
        </div>
      </header>

      <!-- Chat area -->
      <div id="chatArea">

        <!-- Empty state -->
        <div id="emptyState">
          <div class="empty-prompt">
            <div class="prompt-line">
              <span class="prompt-user">user@pocket</span><span class="prompt-sep">:</span><span class="prompt-path">~</span><span class="prompt-dollar">$</span>
              <span class="prompt-cursor blink">_</span>
            </div>
            <div class="empty-tagline">Local inference. No cloud. No logs.</div>
            <div class="empty-hints">
              <span>⏎ send</span>
              <span>⇧⏎ newline</span>
              <span>⌫ clear</span>
            </div>
          </div>
        </div>

        <!-- Messages will be injected here -->
        <div id="messageList"></div>

      </div>

      <!-- Input area -->
      <div id="inputArea">
        <div id="inputWrapper">
          <div class="input-prefix">›</div>
          <textarea
            id="messageInput"
            placeholder="send a message..."
            rows="1"
            spellcheck="true"
            autocomplete="off"
          ></textarea>
          <button id="sendBtn" class="send-btn" title="Send (Enter)" disabled>
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M2 8L14 8M14 8L9 3M14 8L9 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
        <div id="inputMeta">
          <span id="charCount">0</span>
          <span class="meta-sep">·</span>
          <span id="msgCount">0 messages</span>
        </div>
      </div>

    </main>
  </div>

  <!-- Error toast -->
  <div id="errorToast" class="toast toast-error" role="alert" aria-live="assertive"></div>

  <!-- Info toast -->
  <div id="infoToast" class="toast toast-info" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
